name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Package smoke test
        run: npm run test:package

      - name: Security smoke test
        run: npm run test:security

      - name: Package dry run
        run: npm --prefix packages/gate pack --dry-run

      - name: Build
        run: npm run build
        env:
          GATE_PASSWORD: "739184"
          GATE_SECRET: "ci-only-secret-that-is-long-enough-for-build-verification"
          GATE_PIN_LENGTH: "6"
